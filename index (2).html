<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heaven Time • WhatsApp-Style Calculator</title>
<meta name="theme-color" content="#075E54" />
<style>
  :root{
    --wa-bg:#ece5dd;
    --wa-header:#075E54;
    --wa-accent:#25D366;
    --wa-bubble-me:#DCF8C6;
    --wa-bubble-bot:#ffffff;
    --text:#102a27;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--wa-bg);
    font-family:"Segoe UI", Roboto, Arial, sans-serif;
    color:var(--text);
    height:100vh; display:flex; flex-direction:column;
  }
  .app{
    max-width:520px; margin:0 auto; width:100%;
    display:flex; flex-direction:column; height:100vh;
    border-left:1px solid #d7d0c8; border-right:1px solid #d7d0c8;
    background:var(--wa-bg);
  }
  .header{
    background:var(--wa-header); color:#fff;
    padding:12px 16px; display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:10;
  }
  .header .title{font-weight:600; line-height:1.2}
  .header .subtitle{opacity:.85; font-size:12px}
  .chat{
    padding:14px 12px 88px; overflow-y:auto; flex:1; scroll-behavior:smooth;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260"><text x="20" y="40" fill="%23d3cec9" font-size="16" font-family="Arial">Heaven Time</text></svg>');
    background-size:220px;
  }
  .row{display:flex; margin:8px 0; align-items:flex-end}
  .me{justify-content:flex-end}
  .bot{justify-content:flex-start}
  .bubble{
    max-width:80%; padding:10px 12px; border-radius:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    font-size:15px; line-height:1.35; position:relative;
    word-wrap:break-word; white-space:pre-wrap;
    animation: pop 0.15s ease-out;
  }
  .bubble.me{
    background:var(--wa-bubble-me);
    border-top-right-radius:4px;
  }
  .bubble.bot{
    background:var(--wa-bubble-bot);
    border-top-left-radius:4px;
  }
  .timestamp{display:block; opacity:.55; font-size:11px; margin-top:6px}
  .input-bar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:0; width:100%; max-width:520px; background:#f6f1eb; border-top:1px solid #ddd;
    padding:8px; z-index:20;
  }
  .bar-inner{display:flex; gap:8px}
  .field{
    flex:1; background:#fff; border:1.5px solid #c7c3bd; border-radius:20px; padding:10px 14px;
    font-size:16px; outline:none;
  }
  .btn{
    background:var(--wa-accent); color:#fff; border:none; border-radius:20px; padding:10px 16px;
    font-weight:600; cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .chips{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .chip{
    background:#fff; border:1px solid #cfc9c2; border-radius:999px; padding:6px 10px; font-size:13px; cursor:pointer;
  }
  .hint{
    text-align:center; font-size:12px; opacity:.7; margin:4px 0 0;
  }
  @keyframes pop {
    0% {transform: scale(0.95); opacity: 0;}
    100% {transform: scale(1); opacity: 1;}
  }
  .typing-dots{display:inline-flex; align-items:center; gap:3px; height:1em;}
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:#9e9e9e; opacity:.6; display:inline-block;
    animation: bounce 1s infinite ease-in-out;
  }
  .dot:nth-child(2){ animation-delay: .15s; }
  .dot:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:.9;}}
  .quote{
    border-left:4px solid #25D366;
    color:#064e44;
    background:#f4fbf8;
    font-style:italic;
    transition:opacity 2s ease-in;
  }
  .quote small{display:block; margin-top:6px; opacity:.7; font-style:normal;}
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div style="width:34px;height:34px;border-radius:50%;background:#128C7E;display:flex;align-items:center;justify-content:center;font-size:18px">🌌</div>
      <div>
        <div class="title">Heaven Time Bot</div>
        <div class="subtitle">1 Day = 50,000 Earth Years</div>
      </div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="input-bar">
      <div class="bar-inner">
        <input id="age" class="field" type="number" inputmode="numeric" min="1" step="1" placeholder="Type your age in years (e.g., 70)" />
        <button class="btn" id="sendBtn">Send</button>
      </div>
      <div class="chips">
        <button class="chip" data-age="50">50 yrs</button>
        <button class="chip" data-age="60">60 yrs</button>
        <button class="chip" data-age="70">70 yrs</button>
        <button class="chip" data-age="80">80 yrs</button>
        <button class="chip" data-age="100">100 yrs</button>
      </div>
      <p class="hint">Tip: Share this link in your WhatsApp group.</p>
    </div>
  </div>

<script>
  const chat=document.getElementById('chat'),ageInput=document.getElementById('age'),sendBtn=document.getElementById('sendBtn'),chips=document.querySelectorAll('.chip');
  const nowTime=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  function addBubble(t,w='bot',x=''){const r=document.createElement('div');r.className='row '+(w==='me'?'me':'bot');const b=document.createElement('div');b.className='bubble '+(w==='me'?'me':'bot')+(x?' '+x:'');const s=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const f=s.replace(/\*(.+?)\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');b.innerHTML=f+`<span class="timestamp">${nowTime()}</span>`;r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return b;}
  function showTyping(){const r=document.createElement('div');r.className='row bot typing';const b=document.createElement('div');b.className='bubble bot';b.innerHTML=`<span class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;}
  const removeTyping=e=>e&&e.parentNode&&e.parentNode.removeChild(e);
  const formatNumber=(n,d=2)=>Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});
  const computeHeavenTime=y=>({minutes:(y/50000)*24*60});
  function fadeInVerse(t){const b=addBubble(t,'bot','quote');b.style.opacity=0;setTimeout(()=>b.style.opacity=1,50);}
  function replyForYears(y){if(isNaN(y)||y<=0){addBubble("⚠️ Please enter a valid positive number (e.g., 70).");return;}
    const {minutes}=computeHeavenTime(y);
    const m=`If a person lives for *${formatNumber(y,0)} years* on Earth, it equals only *${formatNumber(minutes,2)} minutes* on Almighty Allah’s Divine Clock. ⏱️\n\nThis reflection shows how incredibly short our worldly life truly is — just a few fleeting minutes compared to the eternal Hereafter. Each passing moment is a chance to seek forgiveness, do good, and prepare for our meeting with Allah. 🌙\n\nLet’s make every second of this Dunya meaningful, so that these few minutes become the reason for everlasting success in Akhirah. 🤲`;
    addBubble(m,'bot');
    const t=showTyping();setTimeout(()=>{removeTyping(t);fadeInVerse("“On the Day the Hour begins, the criminals will swear they had remained (in the graves) no more than an hour — thus they were deluded.”\n\n— *Surah Ar-Rūm (30:55)*");},1500);
  }
  function send(){const v=ageInput.value.trim();if(!v)return;addBubble(`My age is ${v} years.`,'me');const t=showTyping();setTimeout(()=>{removeTyping(t);replyForYears(parseFloat(v));},1300);ageInput.value='';ageInput.focus();}
  const init=showTyping();setTimeout(()=>{removeTyping(init);addBubble("As you might already know, the **Day of Qiyamah (Youm-e-Deen)** — the Day of Judgement — will last **50,000 years** according to the Divine scale of time. 🌌\n\nThat means our entire life in this world — whether 60, 70, or 100 years — is only a few **minutes** on Almighty Allah’s Divine Clock. ⏱️\n\nThis realization brings two profound reminders:\n1️⃣ Every moment we live should be spent in the **Zikr (remembrance) of Allah**, preparing for our meeting with Him.\n2️⃣ The Hereafter is **eternal and timeless**, meaning these few minutes on Earth will determine our forever life.\n\nIf you’d like to estimate your *Divine Clock age*, enter your age below or tap one of the quick options.\n\n_**Disclaimer:** Only Almighty Allah knows how much time He has decreed for each of us in this world._ 🤲");
    const t2=showTyping();setTimeout(()=>{removeTyping(t2);fadeInVerse("“He who created death and life to test you — which of you is best in deeds.”\n\n— *Surah Al-Mulk (67:2)*");},1500);},1600);
  sendBtn.addEventListener('click',send);
  ageInput.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
  chips.forEach(c=>c.addEventListener('click',()=>{const y=c.getAttribute('data-age');addBubble(`My age is ${y} years.`,'me');const t=showTyping();setTimeout(()=>{removeTyping(t);replyForYears(parseFloat(y));},1000);}));
</script>
</body>
</html>
