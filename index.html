<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heaven Time • Reflective Calculator</title>
<meta name="theme-color" content="#075E54" />
<style>
  :root{
    --bg:#ece5dd;
    --header:#075E54;
    --accent:#25D366;
    --accent-ultra:#20B08F; /* ultra-minimal mint */
    --bubble-me:#DCF8C6;
    --bubble-bot:#ffffff;
    --ink:#0f2a26;
    --ayah-bg:#f4fbf8;
    --ayah-ink:#064e44;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    height:100vh; display:flex; flex-direction:column;
  }
  .app{
    max-width:560px; margin:0 auto; width:100%;
    display:flex; flex-direction:column; height:100vh;
    border-left:1px solid #d7d0c8; border-right:1px solid #d7d0c8;
    background:var(--bg);
  }
  .header{
    background:var(--header); color:#fff;
    padding:12px 16px; display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:10;
  }
  .title{font-weight:700; letter-spacing:.2px}
  .subtitle{opacity:.85; font-size:12px}
  .chat{
    padding:16px 12px 96px; overflow-y:auto; flex:1; scroll-behavior:smooth;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260"><text x="20" y="40" fill="%23d3cec9" font-size="16" font-family="Arial">Heaven Time</text></svg>');
    background-size:220px;
  }
  .row{display:flex; margin:10px 0; align-items:flex-end}
  .me{justify-content:flex-end}
  .bot{justify-content:flex-start}
  .bubble{
    max-width:86%; padding:12px 14px; border-radius:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    font-size:16px; line-height:1.6; position:relative;
    word-wrap:break-word;
    animation: pop .12s ease-out;
    background:var(--bubble-bot);
  }
  .bubble p{margin:0 0 .8em}
  .bubble ul{margin:.2em 0 .8em 1.2em}
  .bubble li{margin:.2em 0}
  .bubble.me{ background:var(--bubble-me); border-top-right-radius:6px; }
  .bubble.bot{ background:var(--bubble-bot); border-top-left-radius:6px; }
  .timestamp{display:block; opacity:.55; font-size:11px; margin-top:8px}
  .input-bar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:0; width:100%; max-width:560px; background:#f6f1eb; border-top:1px solid #ddd;
    padding:8px; z-index:20;
  }
  .bar-inner{display:flex; gap:8px}
  .field{
    flex:1; background:#fff; border:1.5px solid #c7c3bd; border-radius:22px; padding:12px 14px;
    font-size:16px; outline:none;
  }
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:22px; padding:12px 16px;
    font-weight:700; cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .chips{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .chip{
    background:#fff; border:1px solid #cfc9c2; border-radius:999px; padding:6px 10px; font-size:13px; cursor:pointer;
  }
  .hint{ text-align:center; font-size:12px; opacity:.7; margin:4px 0 0; }
  @keyframes pop { 0% {transform: scale(0.96); opacity: 0;} 100% {transform: scale(1); opacity: 1;} }
  .typing-dots{display:inline-flex; align-items:center; gap:3px; height:1em;}
  .dot{ width:6px; height:6px; border-radius:50%; background:#9e9e9e; opacity:.6; display:inline-block; animation: bounce 1s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay: .15s; } .dot:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:.9;}}
  .ayah{
    background:var(--ayah-bg);
    border-left:4px solid var(--accent);
    color:var(--ayah-ink);
    padding:10px 12px;
    margin:14px 0;
    font-style:italic;
    border-radius:8px;
  }
  .ayah .src{display:block; margin-top:6px; opacity:.8; font-style:normal;}
  /* Minutes highlight — ultra minimal left-floated */
  .minutes-highlight{
    margin:14px 0 16px 10%;
    font-size:20px;
    font-weight:700;
    color:var(--accent-ultra);
    opacity:0;
    transform:translateY(4px);
    animation: reveal 700ms ease-out forwards;
  }
  @keyframes reveal{
    to { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div style="width:34px;height:34px;border-radius:50%;background:#128C7E;display:flex;align-items:center;justify-content:center;font-size:18px">🌌</div>
      <div>
        <div class="title">Heaven Time Bot</div>
        <div class="subtitle">Youm‑e‑Deen (the Day of Judgement)</div>
      </div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="input-bar">
      <div class="bar-inner">
        <input id="age" class="field" type="number" inputmode="numeric" min="1" step="1" placeholder="Type your age in years (e.g., 70)" />
        <button class="btn" id="sendBtn">Send</button>
      </div>
      <div class="chips">
        <button class="chip" data-age="50">50 yrs</button>
        <button class="chip" data-age="60">60 yrs</button>
        <button class="chip" data-age="70">70 yrs</button>
        <button class="chip" data-age="80">80 yrs</button>
        <button class="chip" data-age="100">100 yrs</button>
      </div>
      <p class="hint">Tip: Share this link in your WhatsApp group.</p>
    </div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const ageInput = document.getElementById('age');
  const sendBtn = document.getElementById('sendBtn');
  const chips = document.querySelectorAll('.chip');

  const nowTime = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  function addBubble(html, who='bot', extraClass=''){
    const row = document.createElement('div');
    row.className = 'row ' + (who==='me' ? 'me' : 'bot');
    const bub = document.createElement('div');
    bub.className = 'bubble ' + (who==='me' ? 'me' : 'bot') + (extraClass ? ' ' + extraClass : '');
    bub.innerHTML = html + `<span class="timestamp">${nowTime()}</span>`;
    row.appendChild(bub);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bub;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row bot typing';
    const bub = document.createElement('div');
    bub.className = 'bubble bot';
    bub.innerHTML = `<span class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
    row.appendChild(bub);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }
  const removeTyping = el => el?.parentNode?.removeChild(el);

  const formatNumber = (n,d=2) => Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});
  const computeHeavenTime = years => ({ minutes: (years / 50000) * 24 * 60 });

  function resultReply(years){
    const {minutes} = computeHeavenTime(years);
    const msgTop = `
      <p><strong>If a person lives for ${formatNumber(years,0)} years on Earth:</strong></p>
      <div class="minutes-highlight">It equals only <strong>${formatNumber(minutes,2)} minutes</strong> on Almighty Allah’s Divine Clock ⏱️</div>
      <p>This shows how brief our worldly life truly is — a few fleeting minutes compared to the eternal Hereafter. Each passing moment is a chance to seek forgiveness, do good, and prepare for our meeting with Allah.</p>
      <p>Let’s make every second of this Dunya meaningful, so these few minutes become the reason for everlasting success in Akhirah. 🤲</p>
    `;
    addBubble(msgTop, 'bot');

    const t = showTyping();
    setTimeout(()=>{
      removeTyping(t);
      addBubble(`
        <div class="ayah">
          “On the Day the Hour begins, the criminals will swear they had remained (in the graves) no more than an hour — thus they were deluded.”
          <span class="src">— <em>Surah Ar‑Rūm (30:55)</em></span>
        </div>
      `, 'bot');
    }, 1200);
  }

  function send(){
    const v = ageInput.value.trim();
    if (!v) return;
    addBubble(`<p><strong>Estimated age — ${v} years.</strong></p>`, 'me');
    const t = showTyping();
    setTimeout(()=>{ removeTyping(t); resultReply(parseFloat(v)); }, 1100);
    ageInput.value=''; ageInput.focus();
  }

  // ---------- INTRO (concise, professional, spaced) ----------
  const intro = `
    <p>As you know, <strong>Youm‑e‑Deen (the Day of Judgement)</strong> — by the Divine scale — is equal to <strong>50,000 years</strong>.</p>

    <p><strong>Allah ﷻ says:</strong></p>
    <div class="ayah">
      “The angels and the Spirit (Jibril) ascend to Him in a Day the measure of which is fifty thousand years.”
      <span class="src">— <em>Surah Al‑Maʿārij (70:4)</em></span>
    </div>

    <p>That means our entire life in this world — whether 60, 70, or 100 years — is only a few <em>minutes</em> on Almighty Allah’s Divine Clock.</p>

    <p><strong>Two reflections:</strong></p>
    <ul>
      <li>Spend every moment in the <em>Zikr</em> of Allah, striving for a <em>Qalb‑e‑Salīm</em> and <em>نَّفْسُ ٱلْمُطْمَئِنَّةُ</em> — so we meet Him among the successful.</li>
      <li>The Hereafter is eternal. These few minutes on Earth will determine our forever.</li>
    </ul>

    <div class="ayah">
      “He is the One Who created death and life to test you — to see which of you is best in deeds. And He is the Almighty, the All‑Forgiving.”
      <span class="src">— <em>Surah Al‑Mulk (67:2)</em></span>
    </div>

    <div class="ayah">
      “O tranquil soul! Return to your Lord, well‑pleased and well‑pleasing. Enter among My servants, and enter My Paradise.”
      <span class="src">— <em>Surah Al‑Fajr (89:27–30)</em></span>
    </div>

    <p>If you’d like to estimate your Divine Clock age, enter your age below or tap a quick option.</p>
    <p><em><strong>Disclaimer:</strong> Only Almighty Allah knows how much time He has decreed for each of us in this world.</em></p>
  `;

  const typing = showTyping();
  setTimeout(()=>{ removeTyping(typing); addBubble(intro, 'bot'); }, 1600);

  // events
  sendBtn.addEventListener('click', send);
  ageInput.addEventListener('keydown', e => { if(e.key==='Enter') send(); });
  chips.forEach(ch => ch.addEventListener('click', () => {
    const yrs = ch.getAttribute('data-age');
    addBubble(`<p><strong>Estimated age — ${yrs} years.</strong></p>`, 'me');
    const t = showTyping();
    setTimeout(()=>{ removeTyping(t); resultReply(parseFloat(yrs)); }, 900);
  }));
</script>
</body>
</html>
